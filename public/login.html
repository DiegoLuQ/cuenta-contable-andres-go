<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar · Cuentas Contables</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <main class="login-wrap">
    <div class="card login-card">
      <div class="brand login-brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">Cuentas Contables</h1>
          <p class="brand-subtitle">Ingresa con tu usuario</p>
        </div>
      </div>

      <form id="login-form" class="login-form" autocomplete="on">
        <div class="form-group">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <p class="login-error" id="login-error" role="alert"></p>
        <button type="submit" class="btn btn-primary login-btn" id="btn-login">Ingresar</button>
      </form>
    </div>
  </main>
  <script src="login.js"></script>
</body>
</html>
